# Manual full Qodana scan (separate from CI).
name: Qodana (Manual)
on:
  workflow_dispatch:
    inputs:
      # Use baseline to reduce existing-noise.
      use_baseline:
        description: "Use qodana.sarif.json baseline"
        required: true
        default: true
        type: boolean

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: ${{ inputs.use_baseline && '--baseline,qodana.sarif.json' || '' }}
          pr-mode: false
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: false
          push-fixes: 'none'
